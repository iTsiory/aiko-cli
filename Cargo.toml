[package]
name = "aiko-cli"
version = "0.1.0"
edition = "2021"
description = "Terminal client for the Aiko gateway"

[[bin]]
name = "aiko"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
